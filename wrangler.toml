# Cloudflare Pages configuration. Deploy from the dashboard (connect the GitHub repo,
# build command empty, output directory "/") or locally with: npx wrangler pages deploy .
name = "aplusstudio"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"

[vars]
# Studio inbox and verified sender. Override per environment in the dashboard.
CONTACT_TO = "hello@aplusstudio.dz"
CONTACT_FROM = "A+ Studio <onboarding@resend.dev>"

# Secrets (never commit): set with `npx wrangler pages secret put NAME` or in the dashboard.
#   RESEND_API_KEY
#   TURNSTILE_SECRET_KEY
